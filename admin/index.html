<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ShopVerse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="logo">Shop<span>Verse</span> <span style="font-size:12px;color:var(--accent)">Admin</span></a>
      <div class="nav-icons">
        <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-box">
        <h2>Admin Login</h2>
        <p class="subtitle">Enter your credentials</p>
        <form id="adminLoginForm">
          <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="adminEmail" class="input" value="admin@admin.com" required>
          </div>
          <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="adminPassword" class="input" placeholder="Enter admin password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Access Admin Panel</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      if (password !== '722140') { App.showToast('Invalid admin password', 'error'); return; }
      const user = await Auth.login(email, password);
      if (user) window.location.href = 'dashboard.html';
    });
    auth.onAuthStateChanged(user => { if (user && user.email === 'admin@admin.com') window.location.href = 'dashboard.html'; });
  </script>
</body>
</html>
