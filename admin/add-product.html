<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <a href="dashboard.html" class="logo">Shop<span>Verse</span> <span style="font-size:10px;color:var(--accent)">Admin</span></a>
      <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="products.html" class="nav-item active"><i class="fas fa-box"></i> Products</a>
      <a href="categories.html" class="nav-item"><i class="fas fa-tags"></i> Categories</a>
      <a href="orders.html" class="nav-item"><i class="fas fa-truck"></i> Orders</a>
      <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
      <a href="reviews.html" class="nav-item"><i class="fas fa-star"></i> Reviews</a>
      <a href="coupons.html" class="nav-item"><i class="fas fa-percent"></i> Coupons</a>
      <a href="banners.html" class="nav-item"><i class="fas fa-images"></i> Banners</a>
      <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
      <div class="nav-divider"></div>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      <a href="../index.html" class="nav-item"><i class="fas fa-store"></i> View Store</a>
      <a href="#" class="nav-item" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </aside>
    <div class="admin-overlay" id="adminOverlay" onclick="document.getElementById('adminSidebar').classList.remove('open');this.classList.remove('show')"></div>
    <div class="admin-main">
      <header class="admin-header">
        <button class="btn btn-sm btn-secondary" onclick="document.getElementById('adminSidebar').classList.toggle('open');document.getElementById('adminOverlay').classList.toggle('show')" style="display:none"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Add Product</h1>
        <div class="admin-actions">
          <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
          <span id="adminName"></span>
        </div>
      </header>

      <form id="productForm" class="form-card" style="max-width:800px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="name" class="input" required>
          </div>
          <div class="form-group">
            <label>Brand</label>
            <input type="text" id="brand" class="input">
          </div>
          <div class="form-group">
            <label>SKU</label>
            <input type="text" id="sku" class="input">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="category" class="input" required><option value="">Select category</option></select>
          </div>
          <div class="form-group">
            <label>Price (₹) *</label>
            <input type="number" id="price" class="input" min="0" step="0.01" required oninput="calcDiscount()">
          </div>
          <div class="form-group">
            <label>Sale Price (₹)</label>
            <input type="number" id="salePrice" class="input" min="0" step="0.01" oninput="calcDiscount()">
          </div>
          <div class="form-group">
            <label>Discount (%)</label>
            <input type="number" id="discount" class="input" min="0" max="100" step="0.1" readonly>
          </div>
          <div class="form-group">
            <label>Stock *</label>
            <input type="number" id="stock" class="input" min="0" required>
          </div>
          <div class="form-group">
            <label>Tags (comma separated)</label>
            <input type="text" id="tags" class="input" placeholder="e.g. new,trending,bestseller">
          </div>
          <div class="form-group">
            <label>Video URL</label>
            <input type="url" id="videoUrl" class="input" placeholder="https://youtube.com/...">
          </div>
        </div>

        <div class="form-group" style="margin-top:12px">
          <label>Description</label>
          <textarea id="description" class="input" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label>Product Images</label>
          <input type="file" id="images" class="input" accept="image/*" multiple>
          <div id="imagePreview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="featured">
            <span>Featured Product</span>
          </label>
        </div>

        <div style="display:flex;gap:12px;margin-top:20px">
          <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fas fa-save"></i> Add Product</button>
          <a href="products.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    auth.onAuthStateChanged(async user => {
      if (!Admin.checkAuth()) return;
      document.getElementById('adminName').textContent = user.email;

      const catSnap = await db.ref('categories').once('value');
      const sel = document.getElementById('category');
      if (catSnap.val()) {
        Object.entries(catSnap.val()).forEach(([id, c]) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = c.name || c.categoryName || c.title;
          sel.appendChild(opt);
        });
      }
    });

    document.getElementById('images').addEventListener('change', function () {
      const container = document.getElementById('imagePreview');
      container.innerHTML = '';
      Array.from(this.files).forEach(f => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        img.style.cssText = 'width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border)';
        container.appendChild(img);
      });
    });

    function calcDiscount() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const sale = parseFloat(document.getElementById('salePrice').value) || 0;
      const disc = document.getElementById('discount');
      disc.value = price > 0 && sale > 0 ? ((price - sale) / price * 100).toFixed(1) : 0;
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

      try {
        const files = document.getElementById('images').files;
        let images = [];
        if (files.length) {
          images = await Admin.uploadMultipleImages(files);
        }

        const price = parseFloat(document.getElementById('price').value);
        const salePrice = parseFloat(document.getElementById('salePrice').value) || 0;
        const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);

        const data = {
          name: document.getElementById('name').value,
          description: document.getElementById('description').value,
          price,
          salePrice,
          discount: parseFloat(document.getElementById('discount').value) || 0,
          stock: parseInt(document.getElementById('stock').value),
          brand: document.getElementById('brand').value,
          sku: document.getElementById('sku').value,
          category: document.getElementById('category').value,
          tags,
          images,
          videoUrl: document.getElementById('videoUrl').value,
          featured: document.getElementById('featured').checked
        };

        await Admin.addProduct(data);
        App.showToast('Product added successfully', 'success');
        document.getElementById('productForm').reset();
        document.getElementById('imagePreview').innerHTML = '';
        calcDiscount();
      } catch (err) {
        App.showToast('Error adding product: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Add Product';
      }
    });
  </script>
</body>
</html>
