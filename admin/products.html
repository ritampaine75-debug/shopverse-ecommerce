<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <a href="dashboard.html" class="logo">Shop<span>Verse</span> <span style="font-size:10px;color:var(--accent)">Admin</span></a>
      <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="products.html" class="nav-item active"><i class="fas fa-box"></i> Products</a>
      <a href="categories.html" class="nav-item"><i class="fas fa-tags"></i> Categories</a>
      <a href="orders.html" class="nav-item"><i class="fas fa-truck"></i> Orders</a>
      <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
      <a href="reviews.html" class="nav-item"><i class="fas fa-star"></i> Reviews</a>
      <a href="coupons.html" class="nav-item"><i class="fas fa-percent"></i> Coupons</a>
      <a href="banners.html" class="nav-item"><i class="fas fa-images"></i> Banners</a>
      <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
      <div class="nav-divider"></div>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      <a href="../index.html" class="nav-item"><i class="fas fa-store"></i> View Store</a>
      <a href="#" class="nav-item" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </aside>
    <div class="admin-overlay" id="adminOverlay"></div>
    <div class="admin-main">
      <header class="admin-header">
        <h1 class="page-title">Products</h1>
        <div class="admin-actions">
          <a href="add-product.html" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Add Product</a>
          <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
        </div>
      </header>
      <div style="margin-bottom:16px"><input type="text" id="searchProducts" class="input" style="max-width:300px" placeholder="Search products..." oninput="renderProducts()"></div>
      <div style="overflow-x:auto"><table class="table" id="productsTable"><thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="productsBody"></tbody></table></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let allProducts = [];
    auth.onAuthStateChanged(async user => {
      if (!Admin.checkAuth()) return;
      const snap = await db.ref('products').once('value');
      if (snap.val()) allProducts = Object.entries(snap.val()).map(([id, p]) => ({ id, ...p }));
      renderProducts();
    });
    function renderProducts() {
      const q = document.getElementById('searchProducts').value.toLowerCase();
      const filtered = allProducts.filter(p => p.name?.toLowerCase().includes(q));
      document.getElementById('productsBody').innerHTML = filtered.map(p => `
        <tr>
          <td><img src="${p.images?.[0] || p.image||'https://via.placeholder.com/40'}" style="width:40px;height:40px;object-fit:cover;border-radius:4px"></td>
          <td><strong>${p.name}</strong></td>
          <td>${App.formatPrice(p.salePrice || p.price)}</td>
          <td><span style="color:${p.stock < 10 ? '#e17055' : '#00b894'};font-weight:600">${p.stock}</span></td>
          <td><span class="badge ${p.status === 'active' ? 'badge-success' : 'badge-danger'}">${p.status}</span></td>
          <td class="actions">
            <a href="edit-product.html?id=${p.id}" class="btn btn-sm btn-secondary"><i class="fas fa-edit"></i></a>
            <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
            <button class="btn btn-sm ${p.status === 'active' ? 'btn-secondary' : 'btn-success'}" onclick="toggleStatus('${p.id}','${p.status}')">${p.status === 'active' ? 'Deactivate' : 'Activate'}</button>
          </td>
        </tr>
      `).join('');
    }
    async function deleteProduct(id) { if (confirm('Delete this product?')) { await Admin.deleteProduct(id); allProducts = allProducts.filter(p => p.id !== id); renderProducts(); App.showToast('Deleted', 'info'); } }
    async function toggleStatus(id, current) { const status = current === 'active' ? 'inactive' : 'active'; await db.ref(`products/${id}/status`).set(status); const p = allProducts.find(x => x.id === id); if (p) p.status = status; renderProducts(); }
  </script>
</body>
</html>
