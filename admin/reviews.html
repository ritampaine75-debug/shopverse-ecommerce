<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <a href="dashboard.html" class="logo">Shop<span>Verse</span> <span style="font-size:10px;color:var(--accent)">Admin</span></a>
      <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="products.html" class="nav-item"><i class="fas fa-box"></i> Products</a>
      <a href="categories.html" class="nav-item"><i class="fas fa-tags"></i> Categories</a>
      <a href="orders.html" class="nav-item"><i class="fas fa-truck"></i> Orders</a>
      <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Users</a>
      <a href="reviews.html" class="nav-item active"><i class="fas fa-star"></i> Reviews</a>
      <a href="coupons.html" class="nav-item"><i class="fas fa-percent"></i> Coupons</a>
      <a href="banners.html" class="nav-item"><i class="fas fa-images"></i> Banners</a>
      <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
      <div class="nav-divider"></div>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
      <a href="../index.html" class="nav-item"><i class="fas fa-store"></i> View Store</a>
      <a href="#" class="nav-item" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </aside>
    <div class="admin-overlay" id="adminOverlay" onclick="document.getElementById('adminSidebar').classList.remove('open');this.classList.remove('show')"></div>
    <div class="admin-main">
      <header class="admin-header">
        <h1 class="page-title">Reviews</h1>
        <div class="admin-actions">
          <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
        </div>
      </header>
      <div style="overflow-x:auto"><table class="table" id="reviewsTable"><thead><tr><th>Product</th><th>User</th><th>Rating</th><th>Review</th><th>Status</th><th>Actions</th></tr></thead><tbody id="reviewsBody"></tbody></table></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let allReviews = [];
    let productNames = {};

    auth.onAuthStateChanged(async user => {
      if (!Admin.checkAuth()) return;
      const [reviewsSnap, productsSnap] = await Promise.all([
        db.ref('reviews').once('value'),
        db.ref('products').once('value')
      ]);
      if (productsSnap.val()) {
        productNames = Object.fromEntries(Object.entries(productsSnap.val()).map(([id, p]) => [id, p.name]));
      }
      if (reviewsSnap.val()) {
        allReviews = Object.entries(reviewsSnap.val()).map(([id, r]) => ({ id, ...r }));
      }
      renderReviews();
    });

    function renderStars(count) {
      return Array(5).fill(0).map((_, i) => `<i class="fas fa-star" style="color:${i < count ? '#fdcb6e' : 'var(--border)'}"></i>`).join('');
    }

    function renderReviews() {
      document.getElementById('reviewsBody').innerHTML = allReviews.map(r => `
        <tr>
          <td><strong>${productNames[r.productId] || 'Unknown Product'}</strong></td>
          <td>${r.userName || r.email || 'Unknown'}</td>
          <td style="white-space:nowrap">${renderStars(r.rating)}</td>
          <td style="max-width:250px;white-space:normal">${r.text || '-'}</td>
          <td><span class="badge ${r.approved ? 'badge-success' : 'badge-warning'}">${r.approved ? 'Approved' : 'Pending'}</span></td>
          <td class="actions">
            ${!r.approved ? `<button class="btn btn-sm btn-success" onclick="approveReview('${r.id}')"><i class="fas fa-check"></i> Approve</button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="deleteReview('${r.id}')"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    async function approveReview(id) {
      await Admin.approveReview(id);
      const r = allReviews.find(x => x.id === id);
      if (r) r.approved = true;
      renderReviews();
    }

    async function deleteReview(id) {
      if (confirm('Delete this review?')) {
        await Admin.deleteReview(id);
        allReviews = allReviews.filter(r => r.id !== id);
        renderReviews();
      }
    }
  </script>
</body>
</html>
