<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - ShopVerse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Shop<span>Verse</span></a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="orders.html">Orders</a>
        <a href="admin/dashboard.html" class="nav-admin" style="display:none">Admin</a>
      </div>
      <div class="nav-icons">
        <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
        <a href="search.html"><i class="fas fa-search"></i></a>
        <a href="wishlist.html"><i class="fas fa-heart"></i><span class="count wishlist-count">0</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="count cart-count">0</span></a>
        <a href="login.html" class="nav-login"><i class="fas fa-user"></i></a>
        <a href="profile.html" class="nav-user" style="display:none"><i class="fas fa-user"></i></a>
      </div>
    </div>
  </nav>
  <div class="container" style="padding-top:120px;padding-bottom:60px;min-height:80vh">
    <div class="search-bar" style="margin-bottom:32px">
      <input type="text" id="searchQuery" class="input" placeholder="Search products..." oninput="debounceSearch();loadSuggestions()">
      <button class="btn btn-primary" onclick="doSearch()"><i class="fas fa-search"></i></button>
    </div>
    <div id="suggestions" style="margin-bottom:16px"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px">
      <select id="searchCat" class="input" style="max-width:200px" onchange="doSearch()"><option value="">All Categories</option></select>
      <input type="number" id="minPrice" class="input" style="max-width:120px" placeholder="Min" onchange="doSearch()">
      <input type="number" id="maxPrice" class="input" style="max-width:120px" placeholder="Max" onchange="doSearch()">
      <select id="searchRating" class="input" style="max-width:150px" onchange="doSearch()">
        <option value="">Any Rating</option><option value="4">4+ ★</option><option value="3">3+ ★</option><option value="2">2+ ★</option>
      </select>
    </div>
    <div class="grid grid-4" id="searchResults"></div>
  </div>
  <footer class="footer">
    <div class="container">
      <div class="grid">
        <div><h4>ShopVerse</h4><p style="color:var(--text-secondary)">Your premium shopping destination.</p></div>
        <div><h4>Quick Links</h4><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a></div>
        <div><h4>Support</h4><a href="contact.html">Contact</a><a href="about.html">About Us</a><a href="faq.html">FAQ</a><a href="privacy.html">Privacy Policy</a></div>
        <div><h4>Follow Us</h4><a href="#"><i class="fab fa-facebook"></i> Facebook</a><a href="#"><i class="fab fa-instagram"></i> Instagram</a><a href="#"><i class="fab fa-twitter"></i> Twitter</a></div>
      </div>
      <div class="bottom">&copy; 2026 ShopVerse. All rights reserved.</div>
    </div>
  </footer>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/search.js"></script>
  <script>
    let searchTimer;
    function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 400); }

    async function loadCategories() {
      const snap = await db.ref('categories').once('value');
      const sel = document.getElementById('searchCat');
      if (snap.val()) Object.entries(snap.val()).forEach(([id, c]) => { sel.innerHTML += `<option value="${id}">${c.name}</option>`; });
    }

    async function doSearch() {
      const q = document.getElementById('searchQuery').value;
      const filters = {
        category: document.getElementById('searchCat').value,
        minPrice: parseFloat(document.getElementById('minPrice').value) || 0,
        maxPrice: parseFloat(document.getElementById('maxPrice').value) || 0,
        rating: parseInt(document.getElementById('searchRating').value) || 0
      };
      const results = await Search.search(q, filters);
      const grid = document.getElementById('searchResults');
      if (!results.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center">No products found</p>'; return; }
      grid.innerHTML = results.map(p => Products.renderCard(p)).join('');
    }

    async function loadSuggestions() {
      const q = document.getElementById('searchQuery').value;
      const container = document.getElementById('suggestions');
      if (q.length < 2) { container.innerHTML = ''; return; }
      const items = await Search.getSuggestions(q);
      if (items.length) container.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap">' + items.map(i =>
        `<div class="badge badge-primary" style="cursor:pointer;font-size:13px" onclick="document.getElementById('searchQuery').value='${i.name}';doSearch()">${i.name}</div>`
      ).join('') + '</div>';
    }

    document.addEventListener('DOMContentLoaded', () => { loadCategories(); const params = new URLSearchParams(window.location.search); if (params.get('q')) { document.getElementById('searchQuery').value = params.get('q'); doSearch(); } });
  </script>
</body>
</html>
