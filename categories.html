  <script>
    async function loadCategories() {
      const snap = await db.ref('categories').once('value');
      const grid = document.getElementById('categoriesGrid');
      if (!snap.val()) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center">No categories</p>'; return; }
      grid.innerHTML = Object.entries(snap.val()).map(([id, c]) => `
        <div class="card fade-in" style="text-align:center;cursor:pointer" onclick="showCategory('${id}')">
          <div style="font-size:48px;margin-bottom:12px">${c.icon || '📦'}</div>
          <h3>${c.name}</h3>
          <p style="color:var(--text-secondary);font-size:13px">${c.description || ''}</p>
        </div>
      `).join('');
      const params = new URLSearchParams(window.location.search);
      if (params.get('cat')) showCategory(params.get('cat'));
    }

    async function showCategory(catId) {
      const snap = await db.ref('products').once('value');
      const catSnap = await db.ref(`categories/${catId}`).once('value');
      const catName = catSnap.val()?.name || 'Category';
      const products = snap.val() ? Object.entries(snap.val()).filter(([, p]) => p.category === catId && p.status === 'active') : [];
      const grid = document.getElementById('categoryProducts');
      if (!products.length) { grid.innerHTML = `<h2 style="grid-column:1/-1">${catName}</h2><p style="grid-column:1/-1">No products in this category</p>`; return; }
      grid.innerHTML = `<h2 style="grid-column:1/-1">${catName}</h2>` + products.map(([id, p]) => Products.renderCard({ id, ...p })).join('');
      grid.scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
