        <a href="orders.html">Orders</a>

      </div>
      <div class="nav-icons">
        <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>

      </div>
    </div>
  </nav>
  <div class="container" style="padding-top:120px;padding-bottom:60px;min-height:80vh">
    <h1 style="font-size:28px;font-weight:800;margin-bottom:32px">My Wishlist</h1>
    <div class="grid grid-4" id="wishlistGrid"></div>
  </div>
  <footer class="footer">
    <div class="container">
      <div class="grid">
        <div><h4>ShopVerse</h4><p style="color:var(--text-secondary)">Your premium shopping destination.</p></div>
        <div><h4>Quick Links</h4><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script>
    window.loadWishlist = async function() {
      const items = await Wishlist.getWishlist();
      const grid = document.getElementById('wishlistGrid');
      if (!items.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center">Your wishlist is empty</p>'; return; }
      grid.innerHTML = items.map(i => Products.renderCard(i.product)).join('');
    };
    auth.onAuthStateChanged(user => { if (user) loadWishlist(); else { document.getElementById('wishlistGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center">Please login to view wishlist</p>'; } });
  </script>
</body>
</html>
