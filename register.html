<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShopVerse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Shop<span>Verse</span></a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="orders.html">Orders</a>
      </div>
      <div class="nav-icons">
        <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
        <a href="wishlist.html"><i class="fas fa-heart"></i><span class="count wishlist-count">0</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="count cart-count">0</span></a>
        <a href="login.html" class="nav-login"><i class="fas fa-user"></i></a>
        <a href="profile.html" class="nav-user" style="display:none"><i class="fas fa-user"></i></a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-box">
        <h2>Create Account</h2>
        <p class="subtitle">Join ShopVerse today</p>
        <form id="registerForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUsername" class="input" placeholder="Choose a username" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" class="input" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-toggle">
              <input type="password" id="regPassword" class="input" placeholder="Create a password" required minlength="6">
              <button type="button" class="toggle" onclick="togglePass('regPassword',this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-toggle">
              <input type="password" id="regConfirm" class="input" placeholder="Confirm password" required>
              <button type="button" class="toggle" onclick="togglePass('regConfirm',this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
        </form>
        <div class="divider">OR</div>
        <button onclick="Auth.loginWithGoogle()" class="btn google-btn"><i class="fab fa-google"></i> Continue with Google</button>
        <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePass(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.innerHTML = inp.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    }
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      if (password !== confirm) { App.showToast('Passwords do not match', 'error'); return; }
      const user = await Auth.register(email, password, username);
      if (user) window.location.href = 'index.html';
    });
    auth.onAuthStateChanged(user => { if (user && window.location.pathname.includes('register.html')) window.location.href = 'index.html'; });
  </script>
</body>
</html>
