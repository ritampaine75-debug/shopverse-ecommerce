<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopVerse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/darkmode.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Shop<span>Verse</span></a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="orders.html">Orders</a>
      </div>
      <div class="nav-icons">
        <button id="themeToggle" class="btn btn-sm btn-secondary"><i class="fas fa-moon"></i></button>
        <a href="wishlist.html"><i class="fas fa-heart"></i><span class="count wishlist-count">0</span></a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i><span class="count cart-count">0</span></a>
        <a href="login.html" class="nav-login"><i class="fas fa-user"></i></a>
        <a href="profile.html" class="nav-user" style="display:none"><i class="fas fa-user"></i></a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-box">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" class="input" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-toggle">
              <input type="password" id="loginPassword" class="input" placeholder="Enter your password" required>
              <button type="button" class="toggle" onclick="togglePass('loginPassword',this)"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <div style="text-align:right;margin-bottom:20px">
            <a href="#" onclick="Auth.forgotPassword(document.getElementById('loginEmail').value);return false" style="color:var(--primary);text-decoration:none;font-size:14px">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
        </form>
        <div class="divider">OR</div>
        <button onclick="Auth.loginWithGoogle()" class="btn google-btn"><i class="fab fa-google"></i> Continue with Google</button>
        <div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePass(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.innerHTML = inp.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const user = await Auth.login(email, password);
      if (user) window.location.href = 'index.html';
    });
    auth.onAuthStateChanged(user => { if (user && window.location.pathname.includes('login.html')) window.location.href = 'index.html'; });
  </script>
</body>
</html>
