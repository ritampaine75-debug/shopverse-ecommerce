  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script>
    async function loadOrders() {
      const orders = await Orders.getUserOrders();
      const container = document.getElementById('ordersList');
      if (!orders.length) { container.innerHTML = '<p style="text-align:center">No orders yet</p>'; return; }
      container.innerHTML = orders.map(o => `
        <div class="card fade-in" style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
            <div><strong>Order #${o.id.slice(-8)}</strong><br><span style="color:var(--text-secondary);font-size:13px">${new Date(o.createdAt).toLocaleDateString()}</span></div>
            <span class="badge" style="background:${Orders.statusColor(o.status)};color:#fff">${o.status}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
            ${o.items.slice(0,3).map(i => `
              <div style="display:flex;gap:12px;align-items:center">
                <img src="${i.image||'https://via.placeholder.com/40'}" style="width:40px;height:40px;object-fit:cover;border-radius:4px">
                <span style="flex:1;font-size:14px">${i.name} x${i.quantity}</span>
                <span style="font-weight:600">${App.formatPrice(i.price * i.quantity)}</span>
              </div>
            `).join('')}
            ${o.items.length > 3 ? `<span style="color:var(--text-secondary);font-size:13px">+${o.items.length - 3} more items</span>` : ''}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <span style="font-weight:800;font-size:18px">Total: ${App.formatPrice(o.total)}</span>
            <div style="display:flex;gap:8px">
              ${o.status !== 'cancelled' && o.status !== 'delivered' ? `<button class="btn btn-danger btn-sm" onclick="cancelOrder('${o.id}')">Cancel</button>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="window.location.href='orders.html?id=${o.id}'">View Details</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    async function cancelOrder(id) { if (confirm('Cancel this order?')) { await Orders.cancelOrder(id); loadOrders(); } }
    auth.onAuthStateChanged(user => { if (user) loadOrders(); else { document.getElementById('ordersList').innerHTML = '<p style="text-align:center">Please login to view orders</p>'; } });
  </script>
</body>
</html>
